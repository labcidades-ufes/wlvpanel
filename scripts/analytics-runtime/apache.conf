ServerName worldlabourvalues.org
ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /dev/null common
</VirtualHost>
